version: '3.9'

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - 5433:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql
    env_file:
      - .env
    networks:
      - nestjs-course

volumes:
  postgres-data:

networks:
  nestjs-course:
